<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <title>Vampire Survivors Enhanced</title>
        <link rel="icon" href="data:," />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            /* Aggressive overflow prevention */
            html {
                overflow: hidden !important;
                position: fixed !important;
                width: 100% !important;
                height: 100% !important;
                top: 0 !important;
                left: 0 !important;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                max-width: 100vw;
                max-height: 100vh;
                overflow: hidden !important; /* CRITICAL: Prevent any element from extending viewport */
                background: #0a0a10;
                font-family: Georgia, 'Times New Roman', serif;
                position: relative;
                box-sizing: border-box;
            }

            #gameCanvas {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
                display: block !important;
                margin: 0 !important;
                padding: 0 !important;
                background: linear-gradient(180deg, #06070c 0%, #0d0c15 55%, #14101a 100%);
                z-index: 1;
                box-sizing: border-box;
            }

            /* Performance Monitor (hidden by default, F2 to toggle) */
            #performanceMonitor {
                position: absolute;
                top: 10px;
                right: 10px;
                background: rgba(0, 0, 0, 0.85);
                color: #f0f0f0;
                padding: 12px 16px;
                border-radius: 8px;
                font-family: 'Courier New', monospace;
                font-size: 11px;
                min-width: 140px;
                display: none;
                z-index: 1000;
                pointer-events: none;
            }

            #performanceMonitor div {
                margin: 2px 0;
            }

            /* Loading screen — gothic threshold: charcoal stone, bone lettering, ember progress */
            #loadingScreen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background:
                    radial-gradient(ellipse 80% 60% at 50% 38%, rgba(60, 52, 44, 0.18), transparent 70%),
                    linear-gradient(180deg, #06070c 0%, #0d0c15 55%, #120d14 100%);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 9999;
                flex-direction: column;
                color: #ede3c8;
            }

            #loadingScreen::after {
                /* vignette */
                content: '';
                position: absolute;
                inset: 0;
                background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.55) 100%);
                pointer-events: none;
            }

            #loadingScreen .load-moon {
                width: 72px;
                height: 72px;
                border-radius: 50%;
                background: radial-gradient(circle at 38% 34%, #f0e7ce 0%, #dccfaf 62%, #b9a888 100%);
                box-shadow:
                    0 0 34px rgba(232, 220, 190, 0.28),
                    0 0 90px rgba(232, 220, 190, 0.12);
                margin-bottom: 34px;
                animation: moonbreathe 3.2s ease-in-out infinite;
            }

            @keyframes moonbreathe {
                0%,
                100% {
                    box-shadow:
                        0 0 30px rgba(232, 220, 190, 0.22),
                        0 0 80px rgba(232, 220, 190, 0.1);
                }
                50% {
                    box-shadow:
                        0 0 42px rgba(232, 220, 190, 0.34),
                        0 0 110px rgba(232, 220, 190, 0.16);
                }
            }

            #loadingScreen h1 {
                color: #ede3c8;
                font-family: 'Cinzel', Georgia, 'Times New Roman', serif;
                font-weight: bold;
                font-size: clamp(26px, 5vw, 44px);
                letter-spacing: 0.14em;
                margin: 0 0 6px 0;
                text-shadow:
                    0 2px 0 rgba(0, 0, 0, 0.8),
                    0 0 26px rgba(224, 138, 60, 0.25);
            }

            #loadingScreen .load-sub {
                color: #c9a86a;
                font-family: 'Cinzel', Georgia, serif;
                font-size: clamp(11px, 1.6vw, 14px);
                letter-spacing: 0.5em;
                text-indent: 0.5em;
                margin-bottom: 44px;
            }

            #loadingScreen .load-track {
                width: min(320px, 70vw);
                height: 8px;
                background: rgba(28, 24, 18, 0.9);
                border: 1px solid rgba(198, 160, 92, 0.35);
                border-radius: 4px;
                overflow: hidden;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            }

            #loadingProgress {
                width: 100%;
                transform: scaleX(0);
                transform-origin: left;
                height: 100%;
                background: linear-gradient(90deg, #5a4210, #b8862e 55%, #e8c96a);
                transition: transform 0.35s ease;
            }

            #loadingStatus {
                margin-top: 16px;
                font-size: 13px;
                color: rgba(190, 180, 160, 0.75);
                letter-spacing: 0.06em;
            }

            #loadingScreen .load-hint {
                margin-top: 40px;
                font-size: 12px;
                color: rgba(170, 158, 132, 0.5);
                letter-spacing: 0.04em;
            }
        </style>
    </head>
    <body>
        <!-- Main game canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Performance Monitor (F2 to toggle) -->
        <div id="performanceMonitor">
            <div>FPS: <span id="fpsDisplay">60</span></div>
            <div>Entities: <span id="entityDisplay">0</span></div>
            <div>Memory: <span id="memoryDisplay">0MB</span></div>
        </div>

        <!-- Loading Screen -->
        <div id="loadingScreen">
            <div class="load-moon"></div>
            <h1>VAMPIRE SURVIVORS</h1>
            <div class="load-sub">ENHANCED</div>
            <div class="load-track"><div id="loadingProgress"></div></div>
            <p id="loadingStatus">Raising the dead…</p>
            <p class="load-hint">WASD move &nbsp;·&nbsp; SPACE evade &nbsp;·&nbsp; auto-attacks do the rest</p>
        </div>

        <script type="module">
            // Hide loading screen after game loads
            function hideLoadingScreen() {
                const loadingScreen = document.getElementById('loadingScreen');
                if (loadingScreen) {
                    loadingScreen.style.transition = 'opacity 0.5s';
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 500);
                }
            }

            // Performance monitor toggle
            document.addEventListener('keydown', (e) => {
                if (e.key === 'F2') {
                    e.preventDefault();
                    const monitor = document.getElementById('performanceMonitor');
                    if (monitor) {
                        monitor.style.display = monitor.style.display === 'none' ? 'block' : 'none';
                    }
                }
            });

            // Update performance stats
            function updatePerformanceStats() {
                if (window.debugCommands) {
                    const info = window.debugCommands.getDebugInfo();
                    if (info && info.performance) {
                        const fpsDisplay = document.getElementById('fpsDisplay');
                        const entityDisplay = document.getElementById('entityDisplay');
                        const memoryDisplay = document.getElementById('memoryDisplay');

                        if (fpsDisplay) fpsDisplay.textContent = info.performance.fps || 60;
                        if (entityDisplay) entityDisplay.textContent = info.performance.entityCount || 0;

                        if (memoryDisplay && window.performance.memory) {
                            const mb = Math.round(window.performance.memory.usedJSHeapSize / 1048576);
                            memoryDisplay.textContent = mb + 'MB';
                        }
                    }
                }
            }

            // Start performance monitoring
            setInterval(updatePerformanceStats, 1000);

            // Error handling
            window.addEventListener('error', (e) => {
                console.error('Runtime error:', e.error);
                console.error('Stack:', e.error?.stack);
            });

            window.addEventListener('unhandledrejection', (e) => {
                console.error('Unhandled promise rejection:', e.reason);
            });
            // Load the game
            console.log('🎮 Loading Vampire Survivors...');

            import('./src/vampireMain.js?v=20260924-bestiary1')
                .then(() => {
                    console.log('✅ Game loaded successfully');

                    // Check if game initialized
                    setTimeout(() => {
                        if (window.gameBootstrap) {
                            console.log('✅ Game bootstrap ready');
                            if (window.gameBootstrap.game) {
                                console.log('✅ Game instance created');
                                console.log('Game state:', window.gameBootstrap.game.gameState);
                                hideLoadingScreen();
                            } else {
                                console.error('❌ Game instance not created');
                                hideLoadingScreen();
                            }
                        } else {
                            console.error('❌ Game bootstrap not created');
                            hideLoadingScreen();
                        }
                    }, 2000);
                })
                .catch((error) => {
                    console.error('❌ Failed to load game:', error);
                    console.error('Stack:', error.stack);
                    hideLoadingScreen();

                    // Show error message
                    const canvas = document.getElementById('gameCanvas');
                    if (canvas) {
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#FF0000';
                        ctx.font = '24px Arial';
                        ctx.fillText('Failed to load game. Check console for errors.', 50, 50);
                    }
                });

            // Game controls info
            console.log(`
🎮 CONTROLS:
━━━━━━━━━━━━━━━━━━━━━
WASD / Arrow Keys: Move
Mouse: Aim
ESC: Pause
F2: Performance Monitor
F4/G: Debug Overlay
━━━━━━━━━━━━━━━━━━━━━
        `);
        </script>
    </body>
</html>
